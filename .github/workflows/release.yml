name: Release

# Releases are cut AUTOMATICALLY on every push to main (each merged PR), and on
# demand via "Run workflow". Modeled on the swarms version-bump flow:
#
#   • Default bump is PATCH (0.2.0 -> 0.2.1).
#   • Add a `minor` label to the PR for a MINOR bump (0.2.0 -> 0.3.0),
#     or a `major` label for a MAJOR bump (0.2.0 -> 1.0.0).
#   • Add a `no-release` label to skip cutting a release.
#   • Manual runs (workflow_dispatch) can force a bump, and recover a missed
#     release by passing the merge commit SHA.
#
# The new version is read from the latest v* tag; the build stamps it into the
# binaries, and the release job creates the GitHub release AND its tag with
# auto-generated notes. Docs-only / workflow-only / install-script changes do
# not trigger a release (see paths-ignore).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'install.sh'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump (auto = use the PR label, default patch)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      pr_sha:
        description: 'Merge commit SHA to read the label from (recovery)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      skip: ${{ steps.compute.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags

      - name: Compute next version
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force >/dev/null 2>&1 || true
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          ver=${latest#v}
          MAJOR=${ver%%.*}; rest=${ver#*.}; MINOR=${rest%%.*}; PATCH=${rest#*.}
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          BUMP_INPUT="${{ github.event.inputs.bump }}"
          if [ -n "$BUMP_INPUT" ] && [ "$BUMP_INPUT" != "auto" ]; then
            BUMP="$BUMP_INPUT"
          else
            # Read the bump from the merged PR's labels (default patch).
            LOOKUP_SHA="${{ github.event.inputs.pr_sha }}"
            LOOKUP_SHA="${LOOKUP_SHA:-${{ github.sha }}}"
            PR_NUMBER=$(gh pr list --state merged --base main --json number,mergeCommit \
              --jq ".[] | select(.mergeCommit.oid == \"$LOOKUP_SHA\") | .number" | head -n1 || true)
            BUMP=patch
            if [ -n "${PR_NUMBER:-}" ]; then
              LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' || true)
              if echo "$LABELS" | grep -qx "no-release"; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Release skipped via 'no-release' label on PR #$PR_NUMBER."
                exit 0
              elif echo "$LABELS" | grep -qx "major"; then BUMP=major
              elif echo "$LABELS" | grep -qx "minor"; then BUMP=minor
              fi
            fi
            echo "PR #${PR_NUMBER:-none} -> bump $BUMP"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0;;
            minor) MINOR=$((MINOR+1)); PATCH=0;;
            patch|*) PATCH=$((PATCH+1));;
          esac
          NEWVER="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEWVER" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEWVER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Computed $BUMP bump: $latest -> v$NEWVER"

  prepare:
    name: Build React Client
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 uses node:sqlite, which needs Node 22+. Node 20 fails the
          # install with ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite.
          node-version: '24'

      - name: Install pnpm
        # Pin to match packageManager so the release pipeline can't silently
        # break on a pnpm major bump (the build-script allowlist lives in
        # pnpm-workspace.yaml's pnpm-11 `allowBuilds`).
        run: npm install -g pnpm@11.5.2

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist/
          retention-days: 1

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [version, prepare]
    if: needs.version.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: agent-chat-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: agent-chat-macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: agent-chat-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      # Stamp the computed version into the build so /api/version (and the update
      # banner) report the real version instead of the hardcoded dev placeholder.
      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "Building version $VERSION"
          sed -i.bak -E 's/^version = "[^"]*"/version = "'"$VERSION"'"/' crates/agent-chat/Cargo.toml
          sed -i.bak -E 's/^version = "[^"]*"/version = "'"$VERSION"'"/' crates/agent-chat-desktop/Cargo.toml
          sed -i.bak -E 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' crates/agent-chat-desktop/tauri.conf.json
          find crates -name '*.bak' -delete

      - name: Build CLI binary
        run: cargo build --release --target ${{ matrix.target }} -p agent-chat

      - name: Ad-hoc sign binary (macOS)
        if: runner.os == 'macOS'
        run: codesign -s - --force target/${{ matrix.target }}/release/agent-chat

      - name: Package binary (macOS)
        if: runner.os == 'macOS'
        run: |
          cp target/${{ matrix.target }}/release/agent-chat agent-chat
          chmod +x agent-chat
          tar czf ${{ matrix.artifact }}.tar.gz agent-chat

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/agent-chat.exe agent-chat.exe
          7z a ${{ matrix.artifact }}.zip agent-chat.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  build-universal-macos:
    name: Build Universal macOS binary
    needs: build-cli
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-chat-macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: agent-chat-macos-x86_64

      - name: Create universal binary
        run: |
          tar xzf agent-chat-macos-arm64.tar.gz
          mv agent-chat agent-chat-arm64
          tar xzf agent-chat-macos-x86_64.tar.gz
          mv agent-chat agent-chat-x86_64
          lipo -create -output agent-chat agent-chat-arm64 agent-chat-x86_64
          chmod +x agent-chat
          tar czf agent-chat-macos-universal.tar.gz agent-chat

      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: agent-chat-macos-universal
          path: agent-chat-macos-universal.tar.gz

  build-tauri:
    name: Build Tauri (macOS ${{ matrix.target }})
    needs: [version, prepare]
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact-name: AgentChat-macos-arm64
          - target: x86_64-apple-darwin
            artifact-name: AgentChat-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "Building version $VERSION"
          sed -i.bak -E 's/^version = "[^"]*"/version = "'"$VERSION"'"/' crates/agent-chat/Cargo.toml
          sed -i.bak -E 's/^version = "[^"]*"/version = "'"$VERSION"'"/' crates/agent-chat-desktop/Cargo.toml
          sed -i.bak -E 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' crates/agent-chat-desktop/tauri.conf.json
          find crates -name '*.bak' -delete

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: crates/agent-chat-desktop

      - name: Package Tauri app
        shell: bash
        run: |
          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/AgentChat.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::AgentChat.app not found at expected path"
            echo "Searching for .app bundle..."
            find target -name "AgentChat.app" -type d 2>/dev/null
            exit 1
          fi
          cd target/${{ matrix.target }}/release/bundle/macos
          tar czf "$GITHUB_WORKSPACE/${{ matrix.artifact-name }}.app.tar.gz" AgentChat.app

      - name: Upload Tauri artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.app.tar.gz

  release:
    name: Create Release
    needs: [version, build-cli, build-universal-macos, build-tauri]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: agent-chat-*

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: AgentChat-*

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          echo "=== All downloaded artifacts ==="
          find artifacts -type f | sort
          echo "=== Collecting release files ==="
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;
          echo "=== Final release files ==="
          ls -la release-files/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Create the release AND its tag at this commit. Publish immediately
          # (not a draft): GitHub's /releases/latest — which install.sh and the
          # in-app update banner both query — EXCLUDES drafts.
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: release-files/*
          body: |
            ## Updating from an earlier version

            **CLI:** quit AgentChat, then re-run the one-line installer — it always
            fetches the latest release, no uninstall needed:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/DheerG/agent-chat/main/install.sh | sh
            ```

            **Desktop app (macOS):** quit AgentChat, download the latest
            `AgentChat-macos-*.app.tar.gz` below, extract it, and drag `AgentChat.app`
            into `/Applications`, replacing the old copy. On first launch, right-click
            the app → **Open** and confirm once (it isn't notarized yet).

            The app shows an **"update available"** banner when a newer release exists.

            ## Install

            **macOS — recommended (one-line install):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/DheerG/agent-chat/main/install.sh | sh
            ```
            Installs `agent-chat` to `/usr/local/bin` (or `~/.local/bin`). Then run `agent-chat`.

            **Why this and not a browser download?** macOS Gatekeeper blocks browser-downloaded binaries unless signed with a paid Apple Developer certificate. `curl` downloads bypass that check, so the install works instantly.

            **macOS — manual download:**
            If you prefer downloading the `.tar.gz` directly:
            ```bash
            tar xzf agent-chat-macos-*.tar.gz
            xattr -d com.apple.quarantine agent-chat
            ./agent-chat
            ```

            **Windows:**
            Download `agent-chat-windows-x86_64.zip`, extract `agent-chat.exe`, and run it.

            **Desktop app (macOS):**
            Download `AgentChat-macos-*.app.tar.gz`, extract, then on first launch:
            1. Double-click `AgentChat.app` — macOS will block it
            2. Open **System Settings → Privacy & Security**
            3. Scroll to **Security**, find the blocked app, click **Open Anyway**
            4. Subsequent launches work normally

            *(A paid Apple Developer signature would eliminate this step. It's on the roadmap.)*
